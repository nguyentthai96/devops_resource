version: "3.9"

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION-latest}
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      # Use single node discovery in order to disable production mode and avoid bootstrap checks.
      # see: https://www.elastic.co/guide/en/elasticsearch/reference/current/bootstrap-checks.html
      - discovery.type=single-node
      - node.name=elasticsearch
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      # Bootstrap password. Used to initialize the keystore during the initial startup of Elasticsearch. Ignored on subsequent runs.
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-}
      # https://ytubl.ink/3BPe # password same bin/elasticsearch-setup-passwords interactive
      # Here below config will apply into /usr/share/elasticsearch/config/elasticsearch.yml
      - xpack.security.enabled=true
      - xpack.security.enrollment.enabled = true
      - xpack.security.http.ssl.enabled = false # false is config http
      # Backup data snapshots
      - path.repo=/usr/share/elasticsearch/snapshots
    ports:
      - 9200:9200
      - 9300:9300
    networks:
      - elastic
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data:rw
      - ./elasticsearch/snapshots:/usr/share/elasticsearch/snapshots
  #      - ./elasticsearch/config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro,Z
  #    command: ["sh", "-c", "/usr/share/elasticsearch/bin/init-user.sh"]
  #   entrypoint is run before contain running
  #   entrypoint: ["/bin/bash", "-c", "if [ ! -f /tmp/init-marker ]; then /docker-entrypoint-initdb.d/init-user.sh && touch /tmp/init-marker; fi && docker-entrypoint.sh"]

  logstash:
    image: docker.elastic.co/logstash/logstash:${STACK_VERSION-latest}
    container_name: logstash
    restart: unless-stopped
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
      - LOGSTASH_INTERNAL_PASSWORD=${LOGSTASH_INTERNAL_PASSWORD:-}
      - XPACK_MANAGEMENT_ENABLED=false # need Upgrade license
      - XPACK_SECURITY_ENABLED=true
      - XPACK_MANAGEMENT_ELASTICSEARCH_HOSTS=http://elasticsearch:9200/
      - XPACK_MANAGEMENT_ELASTICSEARCH_USERNAME=elastic
      - XPACK_MANAGEMENT_ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD:-}
      - XPACK_MONITORING_ENABLED=false
    ports:
      - 5044:5044
      - 50000:50000/tcp
      - 50000:50000/udp
      - 9600:9600
      - 12201:12201
      - 18888:18888
    depends_on:
      - elasticsearch
    networks:
      - elastic
    volumes:
      #      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro,Z
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro,Z
  #      - logstash/data:/usr/share/logstash/data

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION-latest}
    container_name: kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=["http://elasticsearch:9200"]
      # Change this to true if you want to sent telemetry data to kibana developers
      - TELEMETRY_ENABLED=false
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      - KIBANA_SYSTEM_PASSWORD=${KIBANA_PASSWORD}
    #      - SERVER_PUBLICBASEURL=http://kibana.cpbank.kr
    ports:
      - ${KIBANA_PORT}:5601
    depends_on:
      - elasticsearch
    labels:
      # Traefik
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      # Routers
      - "traefik.http.routers.kibana.rule=Host(`kibana.localhost`) || Host(`kibana.cpbank.kr`)"
      - "traefik.http.routers.kibana.entrypoints=web"
      - "traefik.http.services.kibana.loadbalancer.server.port=5601"
    networks:
      - elastic
      - traefik
  #    configs:
  #      - source: kibana_config
  #        target: /usr/share/kibana/config/
  #        uid: '103'
  #        gid: '103'
  #        mode: 0440
  #    volumes:
  #      - ./kibana/config/kibana.yml:/usr/share/kibana/config/kibana.yml
  #      - kibana/data:/usr/share/kibana/data


  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: prometheus
    #    command:
    #      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - 9090:9090
    networks:
      - elastic
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/config/:/etc/prometheus/:ro,z
      #      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: wget --no-verbose --tries=1 --spider localhost:9090 || exit 1
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 5s

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - 3000:3000
    networks:
      - elastic
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - prometheus
    healthcheck:
      test: curl --fail localhost:3000
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  elastic:
    external: false
    driver: bridge
  traefik:
    name: traefik
    external: true
#configs:
#  kibana_config:
#    file: ./kibana/config/kibana.yml

volumes:
  init-marker:
  prometheus_data:
  elasticsearch_data:
    driver: local
    external: false
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/elasticsearch/data

