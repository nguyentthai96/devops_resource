server {
    listen 8443 default_server ssl;
    listen [::]:8443 ssl http2;
    server_name apicorporate.acledabank.com.kh; # Hi Mr. Chenda: domain access folow client and key general

    ssl_password_file /etc/nginx/certs/passphrase;
    #ssl_certificate /etc/nginx/certs/ca.crt;
    #ssl_certificate_key /etc/nginx/certs/ca.key;
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols  TLSv1.2 TLSv1.1 TLSv1;
    ssl_ciphers 'ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-DSS-AES128-GCM-SHA256:kEDH+AESGCM:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA:ECDHE-ECDSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES128-SHA:DHE-DSS-AES128-SHA256:DHE-RSA-AES256-SHA256:DHE-DSS-AES256-SHA:DHE-RSA-AES256-SHA:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA:AES:CAMELLIA:DES-CBC3-SHA:!aNULL:!eNULL:!EXPORT:!DES:!RC4:!MD5:!PSK:!aECDH:!EDH-DSS-DES-CBC3-SHA:!EDH-RSA-DES-CBC3-SHA:!KRB5-DES-CBC3-SHA';
    ssl_prefer_server_ciphers off;

    ssl_verify_client off;
    #ssl_client_certificate /etc/nginx/certs/ca.crt;
    #ssl_verify_client on;
    #ssl_verify_depth  3;
    ssl_session_tickets off;

    access_log   /var/log/nginx/access_acledabank.log;
    error_log    /var/log/nginx/error_info.log info;
    error_log    /var/log/nginx/error_crit.log crit;
    error_log    /var/log/nginx/error_debug.log debug;

    location / {
        proxy_pass https://api.acledabank.com.kh; # domain endpoint
        #
        #NTT without key ACLEDA site proxy_ssl_trusted_certificate /etc/nginx/sslcerts/KEY_FILE_ACL.pem; # if have key
        proxy_ssl_verify              off;  # if with key client
        #
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X_FORWARDED_PROTO https;

        proxy_redirect   off;

        #proxy_set_header Host $http_host;
        #proxy_set_header X-Real-IP $remote_addr;
        #proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #proxy_set_header X-NginX-Proxy true;
        # NTT 20210901
        proxy_buffering                     off;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }
}
